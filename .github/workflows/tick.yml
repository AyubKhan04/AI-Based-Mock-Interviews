# Every 30 minutes, ask the backend to send round reminders and close expired interviews.
# Setup: repo Settings > Secrets and variables > Actions > add API_URL and CRON_SECRET.
name: Reminders
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /tasks/tick
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ]; then echo "API_URL secret not set yet, skipping"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 120 -X POST "$API_URL/tasks/tick" -H "X-Cron-Secret: $CRON_SECRET"
